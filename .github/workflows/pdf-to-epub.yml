name: PDF Novel to EPUB - Layout Only CPU

on:
workflow_dispatch:
    inputs:
        pdf_url:
            description: "Direct URL PDF"
            required: true
            type: string

        book_title:
            description: "Judul buku"
            required: true
            type: string

        author:
            description: "Nama penulis"
            required: false
            type: string
            default: ""

        language:
            description: "Bahasa EPUB"
            required: true
            type: string
            default: "id"

        render_dpi:
            description: "Resolusi render untuk analisis layout"
            required: true
            type: choice
            options:
                - "120"
                - "144"
                - "160"
            default: "144"

        workers:
            description: "Worker Gemini"
            required: true
            type: choice
            options:
                - "1"
                - "2"
                - "3"
                - "4"
    default: "2"

jobs:

convert:

runs-on: ubuntu-latest

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  GEMINI_MODEL: "gemini-2.5-flash"

steps:

  # ============================================================
  # CHECKOUT
  # ============================================================

  - name: Checkout
    uses: actions/checkout@v4


  # ============================================================
  # PYTHON
  # ============================================================

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"


  # ============================================================
  # DOWNLOAD PDF
  # ============================================================

  - name: Download PDF
    env:
      PDF_URL: ${{ inputs.pdf_url }}
    run: |

      mkdir -p input
      mkdir -p output
      mkdir -p work

      curl \
        --fail \
        --location \
        --retry 5 \
        --retry-delay 5 \
        --retry-connrefused \
        --connect-timeout 30 \
        --max-time 3600 \
        "$PDF_URL" \
        -o input/book.pdf

      echo "PDF:"
      ls -lh input/book.pdf

      file input/book.pdf


  # ============================================================
  # DEPENDENCIES
  # ============================================================

  - name: Install dependencies
    run: |

      python -m pip install --upgrade pip

      pip install \
        pymupdf \
        ebooklib \
        pillow \
        google-genai


  # ============================================================
  # MAIN CONVERTER
  # ============================================================

  - name: Convert PDF to EPUB
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BOOK_TITLE: ${{ inputs.book_title }}
      AUTHOR: ${{ inputs.author }}
      LANGUAGE: ${{ inputs.language }}
      RENDER_DPI: ${{ inputs.render_dpi }}
      WORKERS: ${{ inputs.workers }}
    run: |

      cat > convert.py <<'PY'

      import os
      import re
      import json
      import time
      import hashlib

      from pathlib import Path
      from concurrent.futures import (
          ThreadPoolExecutor,
          as_completed
      )

      import fitz

      from google import genai
      from google.genai import types

      from ebooklib import epub


      # ============================================================
      # CONFIG
      # ============================================================

      PDF = Path("input/book.pdf")

      OUT = Path("output")
      WORK = Path("work")

      RENDER_DIR = WORK / "pages"
      LAYOUT_DIR = WORK / "layout"
      IMAGE_DIR = WORK / "images"

      RENDER_DIR.mkdir(
          parents=True,
          exist_ok=True
      )

      LAYOUT_DIR.mkdir(
          parents=True,
          exist_ok=True
      )

      IMAGE_DIR.mkdir(
          parents=True,
          exist_ok=True
      )


      TITLE = os.environ.get(
          "BOOK_TITLE",
          "Book"
      )

      AUTHOR = os.environ.get(
          "AUTHOR",
          ""
      )

      LANGUAGE = os.environ.get(
          "LANGUAGE",
          "id"
      )

      DPI = int(
          os.environ.get(
              "RENDER_DPI",
              "144"
          )
      )

      WORKERS = int(
          os.environ.get(
              "WORKERS",
              "2"
          )
      )

      MODEL = os.environ.get(
          "GEMINI_MODEL",
          "gemini-2.5-flash"
      )

      API_KEY = os.environ.get(
          "GEMINI_API_KEY"
      )

      if not API_KEY:
          raise RuntimeError(
              "GEMINI_API_KEY belum tersedia."
          )


      client = genai.Client(
          api_key=API_KEY
      )


      # ============================================================
      # GEMINI STRUCTURED OUTPUT
      #
      # Gemini TIDAK BOLEH mengembalikan teks.
      # Hanya layout.
      # ============================================================

      SCHEMA = {

          "type": "object",

          "properties": {

              "blocks": {

                  "type": "array",

                  "items": {

                      "type": "object",

                      "properties": {

                          "type": {

                              "type": "string",

                              "enum": [
                                  "chapter",
                                  "body",
                                  "header",
                                  "footer",
                                  "page_number",
                                  "image",
                                  "caption",
                                  "other"
                              ]
                          },

                          "x1": {
                              "type": "number"
                          },

                          "y1": {
                              "type": "number"
                          },

                          "x2": {
                              "type": "number"
                          },

                          "y2": {
                              "type": "number"
                          },

                          "order": {
                              "type": "integer"
                          }
                      },

                      "required": [
                          "type",
                          "x1",
                          "y1",
                          "x2",
                          "y2",
                          "order"
                      ]
                  }
              }
          },

          "required": [
              "blocks"
          ]
      }


      PROMPT = """
      Analyze ONLY the visual layout of this book page.

      IMPORTANT:

      Do NOT perform OCR.

      Do NOT transcribe any text.

      Do NOT return text from the page.

      Do NOT correct spelling.

      Do NOT rewrite anything.

      Do NOT translate anything.

      The PDF text layer is the ONLY source of text.

      Your job is ONLY to identify visual regions.

      Coordinate system:

      top-left = 0,0
      bottom-right = 1000,1000

      Classify regions as:

      chapter
      body
      header
      footer
      page_number
      image
      caption
      other

      CHAPTER:

      Identify chapter headings from typography,
      position, spacing, size, centering and visual hierarchy.

      Do NOT require the word BAB or CHAPTER.

      FOOTER:

      Identify running footer content, page numbers,
      decorative footer elements and repeated bottom-margin
      elements.

      HEADER:

      Identify running headers and repeated top-margin elements.

      IMAGE:

      Identify meaningful illustrations, photographs,
      drawings, maps and decorative images belonging
      to the actual book content.

      A large illustration near the bottom of a page is
      NOT automatically a footer.

      A small repeated logo or decoration in the bottom
      margin should be footer or other.

      Return ONLY the requested JSON structure.

      NEVER return page text.
      """


      # ============================================================
      # UTILITIES
      # ============================================================

      def safe_filename(text):

          text = re.sub(
              r'[\\/:*?"<>|]+',
              "_",
              text
          )

          return text.strip() or "book"


      def overlap(a, b):

          ax1, ay1, ax2, ay2 = a
          bx1, by1, bx2, by2 = b

          x1 = max(ax1, bx1)
          y1 = max(ay1, by1)

          x2 = min(ax2, bx2)
          y2 = min(ay2, by2)

          if x2 <= x1 or y2 <= y1:
              return 0

          inter = (
              (x2 - x1)
              *
              (y2 - y1)
          )

          area = max(
              1,
              (ax2 - ax1)
              *
              (ay2 - ay1)
          )

          return inter / area


      def normalized_bbox(
          bbox,
          width,
          height
      ):

          x1, y1, x2, y2 = bbox

          return (
              x1 / 1000 * width,
              y1 / 1000 * height,
              x2 / 1000 * width,
              y2 / 1000 * height
          )


      # ============================================================
      # RENDER
      # ============================================================

      doc = fitz.open(
          str(PDF)
      )

      PAGE_COUNT = len(doc)

      if PAGE_COUNT == 0:
          raise RuntimeError(
              "PDF kosong."
          )


      print(
          "Pages:",
          PAGE_COUNT
      )


      def render_page(
          page_number
      ):

          path = (
              RENDER_DIR
              /
              f"{page_number + 1:05d}.jpg"
          )

          if path.exists():
              return path

          page = doc[
              page_number
          ]

          zoom = DPI / 72

          pix = page.get_pixmap(
              matrix=fitz.Matrix(
                  zoom,
                  zoom
              ),
              alpha=False
          )

          pix.save(
              str(path),
              jpg_quality=90
          )

          return path


      rendered = {}

      for i in range(
          PAGE_COUNT
      ):

          rendered[i] = render_page(i)


      # ============================================================
      # GEMINI LAYOUT
      # ============================================================

      def analyze(
          page_number
      ):

          cache = (
              LAYOUT_DIR
              /
              f"{page_number + 1:05d}.json"
          )

          if cache.exists():

              with open(
                  cache,
                  "r",
                  encoding="utf-8"
              ) as f:

                  return page_number, json.load(f)


          with open(
              rendered[page_number],
              "rb"
          ) as f:

              image_bytes = f.read()


          part = types.Part.from_bytes(
              data=image_bytes,
              mime_type="image/jpeg"
          )


          last_error = None


          for attempt in range(5):

              try:

                  response = client.models.generate_content(

                      model=MODEL,

                      contents=[

                          types.Content(

                              role="user",

                              parts=[

                                  types.Part.from_text(
                                      text=PROMPT
                                  ),

                                  part
                              ]
                          )
                      ],

                      config=types.GenerateContentConfig(

                          temperature=0,

                          response_mime_type=(
                              "application/json"
                          ),

                          response_schema=SCHEMA
                      )
                  )


                  result = json.loads(
                      response.text
                  )


                  if not isinstance(
                      result.get("blocks"),
                      list
                  ):

                      raise ValueError(
                          "Invalid layout JSON."
                      )


                  with open(
                      cache,
                      "w",
                      encoding="utf-8"
                  ) as f:

                      json.dump(
                          result,
                          f,
                          ensure_ascii=False,
                          indent=2
                      )


                  return (
                      page_number,
                      result
                  )


              except Exception as exc:

                  last_error = exc

                  wait = min(
                      60,
                      2 ** attempt
                  )

                  print(
                      "Gemini error page",
                      page_number + 1,
                      exc
                  )

                  time.sleep(
                      wait
                  )


          raise RuntimeError(
              f"Layout analysis failed "
              f"on page {page_number + 1}: "
              f"{last_error}"
          )


      layouts = {}


      with ThreadPoolExecutor(
          max_workers=WORKERS
      ) as pool:

          futures = [
              pool.submit(
                  analyze,
                  i
              )
              for i in range(
                  PAGE_COUNT
              )
          ]

          for future in as_completed(
              futures
          ):

              page_number, result = (
                  future.result()
              )

              layouts[
                  page_number
              ] = result

              print(
                  "Layout:",
                  page_number + 1,
                  "/",
                  PAGE_COUNT
              )


      # ============================================================
      # EXTRACT PAGE STRUCTURE
      # ============================================================

      pages = []


      for page_number in range(
          PAGE_COUNT
      ):

          page = doc[
              page_number
          ]

          width = page.rect.width
          height = page.rect.height

          layout_blocks = []


          for block in layouts[
              page_number
          ].get(
              "blocks",
              []
          ):

              bbox = normalized_bbox(

                  (
                      block["x1"],
                      block["y1"],
                      block["x2"],
                      block["y2"]
                  ),

                  width,
                  height
              )


              layout_blocks.append({

                  "type": block["type"],

                  "bbox": bbox,

                  "order": block.get(
                      "order",
                      999999
                  )
              })


          # --------------------------------------------------------
          # TEXT LAYER
          # --------------------------------------------------------

          text_blocks = []


          text_dict = page.get_text(
              "dict"
          )


          for block in text_dict.get(
              "blocks",
              []
          ):

              if block.get("type") != 0:
                  continue


              lines = []


              for line in block.get(
                  "lines",
                  []
              ):

                  spans = []


                  for span in line.get(
                      "spans",
                      []
                  ):

                      text = span.get(
                          "text",
                          ""
                      )

                      if not text:
                          continue


                      spans.append({

                          "text": text,

                          "bbox": tuple(
                              span["bbox"]
                          ),

                          "size": span.get(
                              "size",
                              0
                          ),

                          "flags": span.get(
                              "flags",
                              0
                          ),

                          "font": span.get(
                              "font",
                              ""
                          )
                      })


                  if spans:

                      line_text = "".join(
                          s["text"]
                          for s in spans
                      )


                      lines.append({

                          "text": line_text,

                          "bbox": tuple(
                              line["bbox"]
                          ),

                          "spans": spans
                      })


              if lines:

                  text_blocks.append({

                      "bbox": tuple(
                          block["bbox"]
                      ),

                      "lines": lines
                  })


          # --------------------------------------------------------
          # IMAGE OBJECTS
          # --------------------------------------------------------

          images = []


          try:

              infos = page.get_image_info(
                  xrefs=True
              )

          except Exception:

              infos = []


          for info in infos:

              bbox = tuple(
                  info.get(
                      "bbox",
                      (
                          0,
                          0,
                          0,
                          0
                      )
                  )
              )


              if (
                  bbox[2] <= bbox[0]
                  or
                  bbox[3] <= bbox[1]
              ):
                  continue


              images.append({

                  "xref": info.get(
                      "xref",
                      0
                  ),

                  "bbox": bbox
              })


          pages.append({

              "width": width,

              "height": height,

              "layout": layout_blocks,

              "text": text_blocks,

              "images": images
          })


      # ============================================================
      # CLASSIFY TEXT
      # ============================================================

      def classify_text(
          bbox,
          layout
      ):

          best_type = "body"
          best_score = 0


          for block in layout:

              if block["type"] not in {
                  "chapter",
                  "body",
                  "header",
                  "footer",
                  "page_number",
                  "caption"
              }:
                  continue


              score = overlap(
                  bbox,
                  block["bbox"]
              )


              if score > best_score:

                  best_score = score
                  best_type = block["type"]


          if best_score >= 0.15:
              return best_type


          return "body"


      # ============================================================
      # CLASSIFY IMAGE
      # ============================================================

      def classify_image(
          bbox,
          layout,
          width,
          height
      ):

          best = "image"
          score = 0


          for block in layout:

              if block["type"] not in {
                  "image",
                  "footer",
                  "header",
                  "other"
              }:
                  continue


              s = overlap(
                  bbox,
                  block["bbox"]
              )


              if s > score:

                  score = s
                  best = block["type"]


          if (
              best == "footer"
              and score >= 0.20
          ):

              return "footer"


          if (
              best == "header"
              and score >= 0.20
          ):

              return "header"


          if (
              best == "image"
              and score >= 0.15
          ):

              return "image"


          # Conservative fallback.
          #
          # Only tiny bottom decorations are automatically
          # treated as footer.
          #
          # Large bottom illustrations are retained.

          x1, y1, x2, y2 = bbox

          area_ratio = (
              (x2 - x1)
              *
              (y2 - y1)
          ) / (
              width * height
          )

          if (
              y1 / height > 0.90
              and area_ratio < 0.03
          ):

              return "footer"


          return "image"


      # ============================================================
      # IMAGE EXTRACTION
      # ============================================================

      image_files = {}


      for page_number, page_data in enumerate(
          pages
      ):

          page = doc[
              page_number
          ]


          for image in page_data[
              "images"
          ]:

              xref = image[
                  "xref"
              ]

              if not xref:
                  continue


              key = (
                  page_number,
                  xref
              )


              try:

                  extracted = (
                      doc.extract_image(
                          xref
                      )
                  )

              except Exception:

                  continue


              if not extracted:
                  continue


              raw = extracted.get(
                  "image"
              )

              ext = extracted.get(
                  "ext",
                  "png"
              )


              if not raw:
                  continue


              digest = hashlib.sha1(
                  raw
              ).hexdigest()[:16]


              filename = (
                  f"{digest}.{ext}"
              )


              path = (
                  IMAGE_DIR
                  /
                  filename
              )


              if not path.exists():

                  with open(
                      path,
                      "wb"
                  ) as f:

                      f.write(
                          raw
                      )


              image_files[
                  key
              ] = {

                  "filename": filename,

                  "path": path,

                  "bbox": image["bbox"]
              }


      # ============================================================
      # RECONSTRUCT PARAGRAPHS
      #
      # THIS IS THE IMPORTANT PART.
      #
      # PDF line breaks are NOT automatically EPUB paragraph breaks.
      # ============================================================

      def reconstruct_paragraphs(
          lines
      ):

          if not lines:
              return []


          # Sort top -> bottom -> left
          lines = sorted(
              lines,
              key=lambda line: (
                  line["bbox"][1],
                  line["bbox"][0]
              )
          )


          paragraphs = []


          current = None


          for line in lines:

              text = line[
                  "text"
              ]


              if text == "":
                  continue


              x1, y1, x2, y2 = (
                  line["bbox"]
              )


              line_height = max(
                  1,
                  y2 - y1
              )


              if current is None:

                  current = {

                      "lines": [line],

                      "left": x1,

                      "top": y1,

                      "bottom": y2,

                      "right": x2
                  }

                  continue


              prev = current[
                  "lines"
              ][-1]


              px1, py1, px2, py2 = (
                  prev["bbox"]
              )


              previous_height = max(
                  1,
                  py2 - py1
              )


              vertical_gap = (
                  y1 - py2
              )


              # ----------------------------------------------------
              # Estimate whether line belongs to same paragraph.
              # ----------------------------------------------------

              # Normal line spacing is generally <= ~1.7x line height.
              #
              # A substantially larger vertical gap indicates
              # paragraph separation.

              normal_spacing = (
                  vertical_gap
                  <=
                  max(
                      line_height,
                      previous_height
                  ) * 1.65
              )


              # ----------------------------------------------------
              # Indentation
              # ----------------------------------------------------

              previous_left = current[
                  "left"
              ]

              indent_difference = (
                  abs(
                      x1
                      -
                      previous_left
                  )
              )


              # A very large horizontal displacement combined
              # with a vertical gap is evidence of a new paragraph.
              #
              # But normal justified text can have small variations,
              # so this threshold is deliberately conservative.

              strong_indent = (
                  indent_difference
                  >
                  max(
                      12,
                      line_height * 1.8
                  )
              )


              # ----------------------------------------------------
              # Blank-ish line
              # ----------------------------------------------------

              blank_gap = (
                  vertical_gap
                  >
                  max(
                      line_height,
                      previous_height
                  ) * 1.85
              )


              # ----------------------------------------------------
              # Determine paragraph boundary
              # ----------------------------------------------------

              new_paragraph = False


              if blank_gap:
                  new_paragraph = True


              elif (
                  strong_indent
                  and
                  not normal_spacing
              ):
                  new_paragraph = True


              # ----------------------------------------------------
              # Otherwise join lines
              # ----------------------------------------------------

              if new_paragraph:

                  paragraphs.append(
                      current
                  )

                  current = {

                      "lines": [line],

                      "left": x1,

                      "top": y1,

                      "bottom": y2,

                      "right": x2
                  }

              else:

                  current[
                      "lines"
                  ].append(
                      line
                  )

                  current[
                      "bottom"
                  ] = y2

                  current[
                      "right"
                  ] = max(
                      current["right"],
                      x2
                  )


          if current:

              paragraphs.append(
                  current
              )


          return paragraphs


      # ============================================================
      # HYPHENATION
      # ============================================================

      def join_paragraph(
          paragraph
      ):

          lines = paragraph[
              "lines"
          ]


          result = ""


          for index, line in enumerate(
              lines
          ):

              text = line[
                  "text"
              ]


              if index == 0:

                  result += text
                  continue


              # Previous line ends with hyphen.
              #
              # Only treat it as a line-break hyphen when:
              #
              # 1. hyphen is at the end of the line
              # 2. next line starts with a letter
              #
              # This preserves normal internal hyphens.

              if (
                  result.endswith("-")
                  and
                  re.match(
                      r"^\s*[A-Za-zÀ-ÖØ-öø-ÿ]",
                      text
                  )
              ):

                  result = result[:-1]
                  result += text.lstrip()

              else:

                  result += " "
                  result += text.lstrip()


          return result.strip()


      # ============================================================
      # BUILD ELEMENTS
      # ============================================================

      page_elements = []


      for page_number, page_data in enumerate(
          pages
      ):

          elements = []


          # --------------------------------------------------------
          # TEXT BLOCKS
          # --------------------------------------------------------

          for block in page_data[
              "text"
          ]:

              role = classify_text(
                  block["bbox"],
                  page_data["layout"]
              )


              # Remove visual header/footer/page number.

              if role in {
                  "header",
                  "footer",
                  "page_number"
              }:

                  continue


              paragraphs = (
                  reconstruct_paragraphs(
                      block["lines"]
                  )
              )


              for paragraph in paragraphs:

                  text = join_paragraph(
                      paragraph
                  )


                  if not text:
                      continue


                  bbox = (
                      paragraph["left"],
                      paragraph["top"],
                      paragraph["right"],
                      paragraph["bottom"]
                  )


                  elements.append({

                      "kind": "text",

                      "role": role,

                      "text": text,

                      "bbox": bbox,

                      "lines": paragraph[
                          "lines"
                      ]
                  })


          # --------------------------------------------------------
          # IMAGES
          # --------------------------------------------------------

          for image in page_data[
              "images"
          ]:

              key = (
                  page_number,
                  image["xref"]
              )


              extracted = image_files.get(
                  key
              )


              if not extracted:
                  continue


              role = classify_image(
                  image["bbox"],
                  page_data["layout"],
                  page_data["width"],
                  page_data["height"]
              )


              if role != "image":
                  continue


              elements.append({

                  "kind": "image",

                  "bbox": image["bbox"],

                  "filename": extracted[
                      "filename"
                  ]
              })


          # --------------------------------------------------------
          # READING ORDER
          # --------------------------------------------------------

          elements.sort(
              key=lambda element: (
                  element["bbox"][1],
                  element["bbox"][0]
              )
          )


          page_elements.append(
              elements
          )


      # ============================================================
      # CHAPTER DETECTION
      # ============================================================

      chapters = []

      current = None


      for page_number in range(
          PAGE_COUNT
      ):

          layout = pages[
              page_number
          ]["layout"]


          chapter_visual = any(

              block["type"] == "chapter"

              for block in layout
          )


          if chapter_visual:

              chapter_text = []


              for element in page_elements[
                  page_number
              ]:

                  if (
                      element["kind"]
                      ==
                      "text"
                      and
                      element["role"]
                      ==
                      "chapter"
                  ):

                      chapter_text.append(
                          element["text"]
                      )


              if chapter_text:

                  title = " ".join(
                      chapter_text
                  ).strip()

              else:

                  title = (
                      f"Chapter "
                      f"{len(chapters) + 1}"
                  )


              current = {

                  "title": title,

                  "pages": []
              }


              chapters.append(
                  current
              )


          if current is None:

              current = {

                  "title": TITLE,

                  "pages": []
              }


              chapters.append(
                  current
              )


          current[
              "pages"
          ].append(
              page_number
          )


      # Remove duplicate initial fallback chapter
      # when first real chapter was detected.

      if (
          len(chapters) > 1
          and
          chapters[0]["title"] == TITLE
          and
          any(
              block["type"] == "chapter"
              for block in pages[
                  chapters[1]["pages"][0]
              ]["layout"]
          )
      ):

          chapters = chapters[1:]


      print(
          "Detected chapters:",
          len(chapters)
      )


      # ============================================================
      # EPUB
      # ============================================================

      book = epub.EpubBook()


      identifier = (
          "pdf-"
          +
          hashlib.sha1(
              TITLE.encode(
                  "utf-8"
              )
          ).hexdigest()
      )


      book.set_identifier(
          identifier
      )

      book.set_title(
          TITLE
      )

      if AUTHOR:

          book.add_author(
              AUTHOR
          )

      book.set_language(
          LANGUAGE
      )


      # ============================================================
      # CSS
      # ============================================================

      css = """

      html, body {
          margin: 0;
          padding: 0;
      }

      body {
          font-family: serif;
          line-height: 1.45;
          text-align: justify;
          widows: 2;
          orphans: 2;
      }

      p {
          margin-top: 0;
          margin-bottom: 0.75em;
      }

      .chapter-title {
          text-align: center;
          font-weight: bold;
          text-indent: 0;
          margin-top: 2em;
          margin-bottom: 2em;
          page-break-before: always;
      }

      .chapter-title:first-child {
          page-break-before: auto;
      }

      .pdf-image {
          display: block;
          height: auto;
          max-height: 90vh;
          margin-top: 0.8em;
          margin-bottom: 0.8em;
      }

      .image-left {
          margin-left: 0;
          margin-right: auto;
      }

      .image-center {
          margin-left: auto;
          margin-right: auto;
      }

      .image-right {
          margin-left: auto;
          margin-right: 0;
      }

      .image-full {
          width: 100%;
      }

      .image-large {
          width: 75%;
      }

      .image-medium {
          width: 55%;
      }

      .image-small {
          width: 35%;
      }

      """


      style = epub.EpubItem(

          uid="style",

          file_name="Styles/style.css",

          media_type="text/css",

          content=css.encode(
              "utf-8"
          )
      )


      book.add_item(
          style
      )


      # ============================================================
      # EPUB IMAGES
      # ============================================================

      epub_images = {}


      for info in image_files.values():

          path = info[
              "path"
          ]


          ext = path.suffix.lower()


          if ext in {
              ".jpg",
              ".jpeg"
          }:

              media = "image/jpeg"

          elif ext == ".gif":

              media = "image/gif"

          elif ext == ".webp":

              media = "image/webp"

          else:

              media = "image/png"


          with open(
              path,
              "rb"
          ) as f:

              data = f.read()


          item = epub.EpubItem(

              uid=(
                  "img_"
                  +
                  path.stem
              ),

              file_name=(
                  "Images/"
                  +
                  path.name
              ),

              media_type=media,

              content=data
          )


          book.add_item(
              item
          )


          epub_images[
              path.name
          ] = item


      # ============================================================
      # BUILD CHAPTER XHTML
      # ============================================================

      spine = [
          "nav"
      ]

      toc = []


      for chapter_index, chapter in enumerate(
          chapters
      ):

          chapter_id = (
              f"chapter_{chapter_index + 1}"
          )

          filename = (
              f"{chapter_id}.xhtml"
          )


          html = [

              '<html xmlns="http://www.w3.org/1999/xhtml">',

              "<head>",

              '<meta charset="utf-8"/>',

              (
                  "<title>"
                  +
                  epub.escape(
                      chapter["title"]
                  )
                  +
                  "</title>"
              ),

              (
                  '<link rel="stylesheet" '
                  'type="text/css" '
                  'href="../Styles/style.css"/>'
              ),

              "</head>",

              "<body>"
          ]


          first_element = True


          for page_number in chapter[
              "pages"
          ]:

              elements = page_elements[
                  page_number
              ]


              for element in elements:


                  # ==================================================
                  # TEXT
                  # ==================================================

                  if element[
                      "kind"
                  ] == "text":


                      text = element[
                          "text"
                      ]


                      escaped = epub.escape(
                          text
                      )


                      if (
                          element["role"]
                          ==
                          "chapter"
                      ):

                          html.append(
                              '<p class="chapter-title">'
                              +
                              escaped
                              +
                              "</p>"
                          )

                      else:

                          html.append(
                              "<p>"
                              +
                              escaped
                              +
                              "</p>"
                          )


                  # ==================================================
                  # IMAGE
                  # ==================================================

                  elif element[
                      "kind"
                  ] == "image":


                      filename = element[
                          "filename"
                      ]


                      if filename not in epub_images:
                          continue


                      x1, y1, x2, y2 = (
                          element["bbox"]
                      )


                      page_width = pages[
                          page_number
                      ]["width"]


                      width_ratio = (
                          (x2 - x1)
                          /
                          page_width
                      )


                      center_x = (
                          (x1 + x2)
                          /
                          2
                      )


                      if width_ratio >= 0.85:

                          size = (
                              "image-full"
                          )

                      elif width_ratio >= 0.55:

                          size = (
                              "image-large"
                          )

                      elif width_ratio >= 0.30:

                          size = (
                              "image-medium"
                          )

                      else:

                          size = (
                              "image-small"
                          )


                      if (
                          center_x
                          <
                          page_width * 0.35
                      ):

                          alignment = (
                              "image-left"
                          )

                      elif (
                          center_x
                          >
                          page_width * 0.65
                      ):

                          alignment = (
                              "image-right"
                          )

                      else:

                          alignment = (
                              "image-center"
                          )


                      classes = (
                          "pdf-image "
                          +
                          size
                          +
                          " "
                          +
                          alignment
                      )


                      html.append(

                          '<img '
                          'class="'
                          +
                          classes
                          +
                          '" '
                          'src="../Images/'
                          +
                          epub.escape(
                              filename
                          )
                          +
                          '" '
                          'alt=""/>'
                      )


                  first_element = False


          html.append(
              "</body></html>"
          )


          chapter_item = epub.EpubHtml(

              title=chapter[
                  "title"
              ],

              file_name=filename,

              lang=LANGUAGE
          )


          chapter_item.content = (
              "".join(
                  html
              ).encode(
                  "utf-8"
              )
          )


          chapter_item.add_item(
              style
          )


          book.add_item(
              chapter_item
          )


          spine.append(
              chapter_item
          )


          toc.append(
              epub.Link(

                  filename,

                  chapter[
                      "title"
                  ],

                  chapter_id
              )
          )


      # ============================================================
      # NAVIGATION
      # ============================================================

      book.toc = tuple(
          toc
      )


      book.add_item(
          epub.EpubNcx()
      )

      book.add_item(
          epub.EpubNav()
      )


      book.spine = spine


      # ============================================================
      # METADATA
      # ============================================================

      book.add_metadata(

          "DC",

          "description",

          (
              "Converted from a text-based PDF. "
              "Text is extracted from the original PDF "
              "text layer. "
              "AI is used only for visual layout analysis."
          )
      )


      # ============================================================
      # WRITE EPUB
      # ============================================================

      output = (
          OUT
          /
          (
              safe_filename(
                  TITLE
              )
              +
              ".epub"
          )
      )


      epub.write_epub(
          str(output),
          book
      )


      print("")
      print("=" * 70)
      print("DONE")
      print("=" * 70)
      print(
          "Output:",
          output
      )
      print(
          "Pages:",
          PAGE_COUNT
      )
      print(
          "Chapters:",
          len(chapters)
      )
      print(
          "Images:",
          len(epub_images)
      )
      print("=" * 70)

      PY

      python convert.py


  # ============================================================
  # VALIDATE
  # ============================================================

  - name: Validate EPUB
    run: |

      EPUB=$(find output \
        -maxdepth 1 \
        -type f \
        -name "*.epub" \
        | head -n 1)

      if [ -z "$EPUB" ]; then
          echo "EPUB tidak ditemukan."
          exit 1
      fi

      echo "EPUB:"
      ls -lh "$EPUB"

      unzip -t "$EPUB"


  # ============================================================
  # UPLOAD EPUB
  # ============================================================

  - name: Upload EPUB
    uses: actions/upload-artifact@v4
    with:
      name: epub-${{ github.run_number }}
      path: output/*.epub
      if-no-files-found: error
      retention-days: 30


  # ============================================================
  # UPLOAD LAYOUT DATA
  # Berguna untuk debugging kalau ada bab/footer/gambar
  # yang salah terdeteksi.
  # ============================================================

  - name: Upload layout analysis
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: layout-analysis-${{ github.run_number }}
      path: work/layout/
      if-no-files-found: warn
      retention-days: 7