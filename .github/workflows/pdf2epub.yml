name: PDF Novel to EPUB - Local Layout Engine

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "Direct URL PDF"
        required: true
        type: string

      book_title:
        description: "Judul buku"
        required: true
        type: string

      author:
        description: "Nama penulis"
        required: false
        type: string
        default: ""

      language:
        description: "Bahasa EPUB"
        required: true
        type: string
        default: "id"

      render_dpi:
        description: "Resolusi gambar jika diperlukan"
        required: true
        type: choice
        options:
          - "120"
          - "144"
          - "160"
        default: "144"

jobs:
  convert:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PYTHONUNBUFFERED: "1"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # DOWNLOAD PDF
      # ============================================================

      - name: Download PDF
        env:
          PDF_URL: ${{ inputs.pdf_url }}
        run: |
          set -e

          mkdir -p input
          mkdir -p output
          mkdir -p work

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-connrefused \
            --connect-timeout 30 \
            --max-time 3600 \
            "$PDF_URL" \
            -o input/book.pdf

          echo "PDF:"
          ls -lh input/book.pdf

          file input/book.pdf

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            pymupdf \
            ebooklib \
            pillow

      # ============================================================
      # LOCAL LAYOUT ENGINE
      # ============================================================

      - name: Convert PDF to EPUB
        env:
          BOOK_TITLE: ${{ inputs.book_title }}
          AUTHOR: ${{ inputs.author }}
          LANGUAGE: ${{ inputs.language }}
          RENDER_DPI: ${{ inputs.render_dpi }}
        run: |
          set -e

          cat > convert.py <<'PY'

          import os
          import re
          import html
          import hashlib
          import statistics
          from pathlib import Path
          from collections import Counter

          import fitz
          from ebooklib import epub


          # ============================================================
          # CONFIG
          # ============================================================

          PDF = Path("input/book.pdf")
          OUT = Path("output")
          WORK = Path("work")

          IMAGE_DIR = WORK / "images"
          DEBUG_DIR = WORK / "debug"

          OUT.mkdir(
              parents=True,
              exist_ok=True
          )

          WORK.mkdir(
              parents=True,
              exist_ok=True
          )

          IMAGE_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          DEBUG_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          TITLE = os.environ.get(
              "BOOK_TITLE",
              "Book"
          )

          AUTHOR = os.environ.get(
              "AUTHOR",
              ""
          )

          LANGUAGE = os.environ.get(
              "LANGUAGE",
              "id"
          )

          DPI = int(
              os.environ.get(
                  "RENDER_DPI",
                  "144"
              )
          )


          # ============================================================
          # HELPERS
          # ============================================================

          def safe_filename(text):
              text = re.sub(
                  r'[\\/:*?"<>|]+',
                  "_",
                  text
              )

              return text.strip() or "book"


          def normalize_space(text):
              return re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()


          def is_bold(font_name):
              name = (
                  font_name
                  or ""
              ).lower()

              return any(
                  token in name
                  for token in [
                      "bold",
                      "black",
                      "heavy",
                      "demi",
                      "semibold"
                  ]
              )


          def is_italic(font_name):
              name = (
                  font_name
                  or ""
              ).lower()

              return any(
                  token in name
                  for token in [
                      "italic",
                      "oblique"
                  ]
              )


          def bbox_area(bbox):
              x1, y1, x2, y2 = bbox

              return max(
                  0,
                  x2 - x1
              ) * max(
                  0,
                  y2 - y1
              )


          def overlap_ratio(a, b):
              ax1, ay1, ax2, ay2 = a
              bx1, by1, bx2, by2 = b

              x1 = max(
                  ax1,
                  bx1
              )

              y1 = max(
                  ay1,
                  by1
              )

              x2 = min(
                  ax2,
                  bx2
              )

              y2 = min(
                  ay2,
                  by2
              )

              if x2 <= x1 or y2 <= y1:
                  return 0.0

              intersection = (
                  (x2 - x1)
                  *
                  (y2 - y1)
              )

              area = bbox_area(a)

              if area <= 0:
                  return 0.0

              return intersection / area


          def looks_like_page_number(text):
              text = normalize_space(
                  text
              )

              return bool(
                  re.fullmatch(
                      r"[\[\]()\-–—\s]*\d+[\s\]]*",
                      text
                  )
              )


          def looks_like_chapter_text(text):
              text = normalize_space(
                  text
              )

              if not text:
                  return False

              patterns = [
                  r"^(bab|chapter|chapitre|cap[ií]tulo)\s+[\divxlc]+",
                  r"^(bagian|part|section)\s+[\divxlc]+",
                  r"^prolog(?:ue)?$",
                  r"^epilog(?:ue)?$",
                  r"^pendahuluan$",
                  r"^pengantar$",
                  r"^daftar isi$",
                  r"^kata pengantar$",
                  r"^prakata$"
              ]

              lower = text.lower()

              for pattern in patterns:
                  if re.search(
                      pattern,
                      lower
                  ):
                      return True

              return False


          def sentence_ends(text):
              text = normalize_space(
                  text
              )

              return bool(
                  re.search(
                      r"[.!?…][\"'”’)]?$",
                      text
                  )
              )


          def is_short_heading(text):
              text = normalize_space(
                  text
              )

              if not text:
                  return False

              words = text.split()

              if len(words) > 12:
                  return False

              if len(text) > 100:
                  return False

              return not sentence_ends(
                  text
              )


          # ============================================================
          # OPEN PDF
          # ============================================================

          if not PDF.exists():
              raise RuntimeError(
                  "input/book.pdf tidak ditemukan."
              )

          doc = fitz.open(
              str(PDF)
          )

          PAGE_COUNT = len(doc)

          if PAGE_COUNT == 0:
              raise RuntimeError(
                  "PDF kosong."
              )

          print(
              f"Pages: {PAGE_COUNT}"
          )


          # ============================================================
          # EXTRACT RAW PAGE DATA
          # ============================================================

          pages = []

          all_font_sizes = []
          all_font_names = []

          for page_number in range(
              PAGE_COUNT
          ):
              page = doc[
                  page_number
              ]

              page_width = page.rect.width
              page_height = page.rect.height

              text_blocks = []
              images = []

              text_dict = page.get_text(
                  "dict"
              )

              for block in text_dict.get(
                  "blocks",
                  []
              ):
                  if block.get(
                      "type"
                  ) != 0:
                      continue

                  lines = []

                  for line in block.get(
                      "lines",
                      []
                  ):
                      spans = []

                      for span in line.get(
                          "spans",
                          []
                      ):
                          text = span.get(
                              "text",
                              ""
                          )

                          if not text:
                              continue

                          size = float(
                              span.get(
                                  "size",
                                  0
                              )
                          )

                          font = span.get(
                              "font",
                              ""
                          )

                          all_font_sizes.append(
                              size
                          )

                          all_font_names.append(
                              font
                          )

                          spans.append({
                              "text": text,

                              "bbox": tuple(
                                  span["bbox"]
                              ),

                              "size": size,

                              "font": font,

                              "bold": is_bold(
                                  font
                              ),

                              "italic": is_italic(
                                  font
                              )
                          })

                      if not spans:
                          continue

                      line_text = "".join(
                          span["text"]
                          for span in spans
                      )

                      lines.append({
                          "text": line_text,

                          "bbox": tuple(
                              line["bbox"]
                          ),

                          "spans": spans
                      })

                  if lines:
                      text_blocks.append({
                          "bbox": tuple(
                              block["bbox"]
                          ),

                          "lines": lines
                      })

              try:
                  image_infos = (
                      page.get_image_info(
                          xrefs=True
                      )
                  )
              except Exception:
                  image_infos = []

              for info in image_infos:
                  bbox = tuple(
                      info.get(
                          "bbox",
                          (
                              0,
                              0,
                              0,
                              0
                          )
                      )
                  )

                  if bbox_area(
                      bbox
                  ) <= 0:
                      continue

                  images.append({
                      "xref": info.get(
                          "xref",
                          0
                      ),

                      "bbox": bbox
                  })

              pages.append({
                  "width": page_width,

                  "height": page_height,

                  "text": text_blocks,

                  "images": images
              })


          if not all_font_sizes:
              raise RuntimeError(
                  "PDF tidak memiliki text layer."
              )


          # ============================================================
          # GLOBAL FONT STATISTICS
          # ============================================================

          median_font_size = statistics.median(
              all_font_sizes
          )

          common_fonts = Counter(
              all_font_names
          )

          print(
              "Median font size:",
              round(
                  median_font_size,
                  2
              )
          )

          print(
              "Most common fonts:",
              common_fonts.most_common(5)
          )


          # ============================================================
          # DETECT REPEATED HEADER / FOOTER
          # ============================================================

          top_candidates = Counter()
          bottom_candidates = Counter()

          for page_data in pages:
              height = page_data[
                  "height"
              ]

              for block in page_data[
                  "text"
              ]:
                  bbox = block[
                      "bbox"
                  ]

                  y1 = bbox[1]
                  y2 = bbox[3]

                  text = normalize_space(
                      " ".join(
                          line["text"]
                          for line in block["lines"]
                      )
                  )

                  if not text:
                      continue

                  if (
                      y1
                      <
                      height * 0.12
                  ):
                      if len(text) <= 120:
                          top_candidates[
                              text
                          ] += 1

                  if (
                      y2
                      >
                      height * 0.88
                  ):
                      if len(text) <= 120:
                          bottom_candidates[
                              text
                          ] += 1


          min_repeat = max(
              3,
              int(
                  PAGE_COUNT * 0.15
              )
          )

          repeated_headers = {
              text
              for text, count
              in top_candidates.items()
              if count >= min_repeat
          }

          repeated_footers = {
              text
              for text, count
              in bottom_candidates.items()
              if count >= min_repeat
          }

          print(
              "Repeated headers:",
              len(repeated_headers)
          )

          print(
              "Repeated footers:",
              len(repeated_footers)
          )


          # ============================================================
          # EXTRACT IMAGE FILES
          # ============================================================

          image_files = {}

          for page_number, page_data in enumerate(
              pages
          ):
              for image in page_data[
                  "images"
              ]:

                  xref = image[
                      "xref"
                  ]

                  if not xref:
                      continue

                  try:
                      extracted = (
                          doc.extract_image(
                              xref
                          )
                      )
                  except Exception:
                      continue

                  if not extracted:
                      continue

                  raw = extracted.get(
                      "image"
                  )

                  ext = extracted.get(
                      "ext",
                      "png"
                  )

                  if not raw:
                      continue

                  digest = hashlib.sha1(
                      raw
                  ).hexdigest()[:16]

                  filename = (
                      f"{digest}.{ext}"
                  )

                  path = (
                      IMAGE_DIR
                      /
                      filename
                  )

                  if not path.exists():
                      with open(
                          path,
                          "wb"
                      ) as f:
                          f.write(
                              raw
                          )

                  image_files[
                      (
                          page_number,
                          xref
                      )
                  ] = {
                      "filename": filename,

                      "path": path,

                      "bbox": image[
                          "bbox"
                      ]
                  }


          # ============================================================
          # LINE ANALYSIS
          # ============================================================

          def analyze_line(
              line,
              page_width,
              page_height
          ):
              text = normalize_space(
                  line["text"]
              )

              if not text:
                  return None

              x1, y1, x2, y2 = (
                  line["bbox"]
              )

              spans = line[
                  "spans"
              ]

              sizes = [
                  span["size"]
                  for span in spans
                  if span["size"] > 0
              ]

              if sizes:
                  font_size = statistics.median(
                      sizes
                  )
              else:
                  font_size = median_font_size

              bold_ratio = (
                  sum(
                      1
                      for span in spans
                      if span["bold"]
                  )
                  /
                  max(
                      1,
                      len(spans)
                  )
              )

              italic_ratio = (
                  sum(
                      1
                      for span in spans
                      if span["italic"]
                  )
                  /
                  max(
                      1,
                      len(spans)
                  )
              )

              center = (
                  x1 + x2
              ) / 2

              page_center = (
                  page_width / 2
              )

              center_distance = abs(
                  center
                  -
                  page_center
              )

              centered = (
                  center_distance
                  <
                  page_width * 0.12
              )

              width_ratio = (
                  x2 - x1
              ) / page_width

              upper = (
                  y1
                  <
                  page_height * 0.15
              )

              lower = (
                  y2
                  >
                  page_height * 0.85
              )

              page_number = (
                  looks_like_page_number(
                      text
                  )
                  and
                  (
                      upper
                      or
                      lower
                  )
              )

              explicit_chapter = (
                  looks_like_chapter_text(
                      text
                  )
              )

              large_font = (
                  font_size
                  >=
                  median_font_size * 1.45
              )

              medium_large_font = (
                  font_size
                  >=
                  median_font_size * 1.20
              )

              short_heading = (
                  is_short_heading(
                      text
                  )
              )

              chapter_score = 0

              if explicit_chapter:
                  chapter_score += 8

              if large_font:
                  chapter_score += 3

              elif medium_large_font:
                  chapter_score += 1

              if bold_ratio >= 0.5:
                  chapter_score += 2

              if centered:
                  chapter_score += 2

              if short_heading:
                  chapter_score += 1

              if upper and y1 < page_height * 0.35:
                  chapter_score += 1

              if width_ratio < 0.80:
                  chapter_score += 1

              if sentence_ends(text):
                  chapter_score -= 2

              return {
                  "text": text,

                  "bbox": line["bbox"],

                  "font_size": font_size,

                  "bold_ratio": bold_ratio,

                  "italic_ratio": italic_ratio,

                  "centered": centered,

                  "width_ratio": width_ratio,

                  "upper": upper,

                  "lower": lower,

                  "page_number": page_number,

                  "chapter_score": chapter_score
              }


          # ============================================================
          # BUILD LINES
          # ============================================================

          for page_number, page_data in enumerate(
              pages
          ):
              analyzed_lines = []

              for block in page_data[
                  "text"
              ]:
                  for line in block[
                      "lines"
                  ]:
                      result = analyze_line(
                          line,
                          page_data["width"],
                          page_data["height"]
                      )

                      if result:
                          analyzed_lines.append(
                              result
                          )

              page_data[
                  "lines"
              ] = analyzed_lines


          # ============================================================
          # REMOVE HEADER / FOOTER / PAGE NUMBER
          # ============================================================

          for page_data in pages:

              filtered = []

              for line in page_data[
                  "lines"
              ]:
                  text = line[
                      "text"
                  ]

                  if text in repeated_headers:
                      continue

                  if text in repeated_footers:
                      continue

                  if line[
                      "page_number"
                  ]:
                      continue

                  filtered.append(
                      line
                  )

              page_data[
                  "lines"
              ] = filtered


          # ============================================================
          # DETECT CHAPTERS
          # ============================================================

          chapter_starts = []

          for page_number, page_data in enumerate(
              pages
          ):
              candidates = []

              for line in page_data[
                  "lines"
              ]:
                  score = line[
                      "chapter_score"
                  ]

                  if score >= 5:
                      candidates.append(
                          line
                      )

              if candidates:
                  candidates.sort(
                      key=lambda item: (
                          -item["chapter_score"],
                          item["bbox"][1]
                      )
                  )

                  best = candidates[
                      0
                  ]

                  chapter_starts.append({
                      "page": page_number,

                      "text": best[
                          "text"
                      ],

                      "bbox": best[
                          "bbox"
                      ],

                      "score": best[
                          "chapter_score"
                      ]
                  })


          # Remove suspicious duplicate detections
          cleaned_chapters = []

          for chapter in chapter_starts:

              if cleaned_chapters:
                  previous = cleaned_chapters[
                      -1
                  ]

                  if (
                      chapter["page"]
                      ==
                      previous["page"]
                  ):
                      continue

                  if (
                      chapter["page"]
                      -
                      previous["page"]
                      <= 1
                      and
                      normalize_space(
                          chapter["text"]
                      ).lower()
                      ==
                      normalize_space(
                          previous["text"]
                      ).lower()
                  ):
                      continue

              cleaned_chapters.append(
                  chapter
              )

          chapter_starts = cleaned_chapters


          # ============================================================
          # FALLBACK
          # ============================================================

          if not chapter_starts:
              print(
                  "No explicit chapter headings detected."
              )

              chapters = [{
                  "title": TITLE,

                  "pages": list(
                      range(
                          PAGE_COUNT
                      )
                  )
              }]

          else:
              chapters = []

              first_page = 0

              for index, chapter in enumerate(
                  chapter_starts
              ):
                  if index == 0:
                      first_page = 0

                  start_page = chapter[
                      "page"
                  ]

                  if index > 0:
                      previous_page = chapter_starts[
                          index - 1
                      ]["page"]

                      if (
                          start_page
                          <=
                          previous_page
                      ):
                          continue

                  title = normalize_space(
                      chapter["text"]
                  )

                  chapters.append({
                      "title": title,

                      "pages": []
                  })

              for page_number in range(
                  PAGE_COUNT
              ):
                  current_index = 0

                  for index, chapter in enumerate(
                      chapter_starts
                  ):
                      if (
                          page_number
                          >=
                          chapter["page"]
                      ):
                          current_index = index

                  chapters[
                      current_index
                  ]["pages"].append(
                      page_number
                  )


          print(
              "Detected chapters:",
              len(chapters)
          )

          for index, chapter in enumerate(
              chapters,
              start=1
          ):
              print(
                  f"Chapter {index}: "
                  f"{chapter['title']}"
              )


          # ============================================================
          # PARAGRAPH RECONSTRUCTION
          # ============================================================

          def reconstruct_paragraphs(
              lines,
              page_width,
              page_height
          ):
              if not lines:
                  return []

              lines = sorted(
                  lines,
                  key=lambda line: (
                      line["bbox"][1],
                      line["bbox"][0]
                  )
              )

              paragraphs = []

              current = None

              for line in lines:

                  text = line[
                      "text"
                  ]

                  x1, y1, x2, y2 = (
                      line["bbox"]
                  )

                  height = max(
                      1,
                      y2 - y1
                  )

                  if current is None:
                      current = {
                          "lines": [line],

                          "left": x1,

                          "right": x2,

                          "top": y1,

                          "bottom": y2
                      }

                      continue

                  previous = current[
                      "lines"
                  ][-1]

                  px1, py1, px2, py2 = (
                      previous["bbox"]
                  )

                  previous_height = max(
                      1,
                      py2 - py1
                  )

                  vertical_gap = (
                      y1 - py2
                  )

                  left_shift = abs(
                      x1
                      -
                      current["left"]
                  )

                  previous_line_width = (
                      px2 - px1
                  )

                  # ----------------------------------------------------
                  # Estimate line spacing
                  # ----------------------------------------------------

                  large_vertical_gap = (
                      vertical_gap
                      >
                      max(
                          height,
                          previous_height
                      ) * 1.55
                  )

                  very_large_gap = (
                      vertical_gap
                      >
                      max(
                          height,
                          previous_height
                      ) * 2.20
                  )

                  # ----------------------------------------------------
                  # Indentation
                  # ----------------------------------------------------

                  indentation_change = (
                      left_shift
                      >
                      max(
                          10,
                          height * 1.5
                      )
                  )

                  # ----------------------------------------------------
                  # Previous line looks complete
                  # ----------------------------------------------------

                  previous_text = normalize_space(
                      previous["text"]
                  )

                  complete_sentence = (
                      sentence_ends(
                          previous_text
                      )
                  )

                  # ----------------------------------------------------
                  # Current line starts like a new paragraph
                  # ----------------------------------------------------

                  starts_uppercase = bool(
                      re.match(
                          r"^[\"'“‘(\[]*[A-ZÀ-ÖØ-Þ]",
                          text
                      )
                  )

                  # ----------------------------------------------------
                  # Decide paragraph boundary
                  # ----------------------------------------------------

                  new_paragraph = False

                  if very_large_gap:
                      new_paragraph = True

                  elif (
                      large_vertical_gap
                      and
                      complete_sentence
                  ):
                      new_paragraph = True

                  elif (
                      indentation_change
                      and
                      large_vertical_gap
                  ):
                      new_paragraph = True

                  elif (
                      complete_sentence
                      and
                      starts_uppercase
                      and
                      vertical_gap
                      >
                      max(
                          height,
                          previous_height
                      ) * 1.35
                  ):
                      new_paragraph = True

                  if new_paragraph:

                      paragraphs.append(
                          current
                      )

                      current = {
                          "lines": [line],

                          "left": x1,

                          "right": x2,

                          "top": y1,

                          "bottom": y2
                      }

                  else:

                      current[
                          "lines"
                      ].append(
                          line
                      )

                      current[
                          "right"
                      ] = max(
                          current["right"],
                          x2
                      )

                      current[
                          "bottom"
                      ] = y2

              if current:
                  paragraphs.append(
                      current
                  )

              return paragraphs


          # ============================================================
          # JOIN PARAGRAPH
          # ============================================================

          def join_paragraph(
              paragraph
          ):
              result = ""

              lines = paragraph[
                  "lines"
              ]

              for index, line in enumerate(
                  lines
              ):
                  text = line[
                      "text"
                  ].strip()

                  if not text:
                      continue

                  if index == 0:
                      result = text
                      continue

                  # ----------------------------------------------------
                  # Hyphenated line break
                  # ----------------------------------------------------

                  if (
                      result.endswith("-")
                      and
                      re.match(
                          r"^[A-Za-zÀ-ÖØ-öø-ÿ]",
                          text
                      )
                  ):
                      result = (
                          result[:-1]
                          +
                          text
                      )

                  else:
                      result += " " + text

              return normalize_space(
                  result
              )


          # ============================================================
          # BUILD PAGE ELEMENTS
          # ============================================================

          page_elements = []

          for page_number, page_data in enumerate(
              pages
          ):
              elements = []

              chapter_bbox = None

              for chapter in chapter_starts:
                  if (
                      chapter["page"]
                      ==
                      page_number
                  ):
                      chapter_bbox = chapter[
                          "bbox"
                      ]

                      break

              paragraphs = reconstruct_paragraphs(
                  page_data["lines"],
                  page_data["width"],
                  page_data["height"]
              )

              for paragraph in paragraphs:

                  text = join_paragraph(
                      paragraph
                  )

                  if not text:
                      continue

                  bbox = (
                      paragraph["left"],
                      paragraph["top"],
                      paragraph["right"],
                      paragraph["bottom"]
                  )

                  role = "body"

                  # ----------------------------------------------------
                  # Chapter
                  # ----------------------------------------------------

                  if chapter_bbox is not None:

                      score = overlap_ratio(
                          bbox,
                          chapter_bbox
                      )

                      if score >= 0.20:
                          role = "chapter"

                  # ----------------------------------------------------
                  # Additional heading heuristic
                  # ----------------------------------------------------

                  if role == "body":

                      first_line = paragraph[
                          "lines"
                      ][0]

                      fs = first_line[
                          "font_size"
                      ]

                      bold = (
                          first_line[
                              "bold_ratio"
                          ]
                          >=
                          0.5
                      )

                      centered = first_line[
                          "centered"
                      ]

                      if (
                          fs
                          >=
                          median_font_size * 1.35
                          and
                          bold
                          and
                          centered
                          and
                          len(
                              text.split()
                          )
                          <= 12
                      ):
                          role = "chapter"

                  elements.append({
                      "kind": "text",

                      "role": role,

                      "text": text,

                      "bbox": bbox
                  })


              # --------------------------------------------------------
              # Images
              # --------------------------------------------------------

              for image in page_data[
                  "images"
              ]:

                  key = (
                      page_number,
                      image["xref"]
                  )

                  extracted = image_files.get(
                      key
                  )

                  if not extracted:
                      continue

                  elements.append({
                      "kind": "image",

                      "bbox": image[
                          "bbox"
                      ],

                      "filename": extracted[
                          "filename"
                      ]
                  })


              # --------------------------------------------------------
              # Reading order
              # --------------------------------------------------------

              elements.sort(
                  key=lambda element: (
                      element["bbox"][1],
                      element["bbox"][0]
                  )
              )

              page_elements.append(
                  elements
              )


          # ============================================================
          # CREATE EPUB
          # ============================================================

          book = epub.EpubBook()

          identifier = (
              "pdf-"
              +
              hashlib.sha1(
                  TITLE.encode(
                      "utf-8"
                  )
              ).hexdigest()
          )

          book.set_identifier(
              identifier
          )

          book.set_title(
              TITLE
          )

          if AUTHOR:
              book.add_author(
                  AUTHOR
              )

          book.set_language(
              LANGUAGE
          )


          # ============================================================
          # CSS
          # ============================================================

          css = """
          html, body {
              margin: 0;
              padding: 0;
          }

          body {
              font-family: serif;
              line-height: 1.45;
              text-align: justify;
              widows: 2;
              orphans: 2;
          }

          p {
              margin: 0 0 0.75em 0;
              text-indent: 1.2em;
          }

          .chapter-title {
              text-align: center;
              font-weight: bold;
              font-size: 1.35em;
              text-indent: 0;
              margin-top: 2em;
              margin-bottom: 2em;
              page-break-before: always;
          }

          .chapter-title:first-child {
              page-break-before: auto;
          }

          .pdf-image {
              display: block;
              height: auto;
              max-width: 100%;
              margin-top: 1em;
              margin-bottom: 1em;
          }

          .image-left {
              margin-left: 0;
              margin-right: auto;
          }

          .image-center {
              margin-left: auto;
              margin-right: auto;
          }

          .image-right {
              margin-left: auto;
              margin-right: 0;
          }

          .image-full {
              width: 100%;
          }

          .image-large {
              width: 75%;
          }

          .image-medium {
              width: 55%;
          }

          .image-small {
              width: 35%;
          }

          .no-indent {
              text-indent: 0;
          }
          """

          style = epub.EpubItem(
              uid="style",

              file_name="Styles/style.css",

              media_type="text/css",

              content=css.encode(
                  "utf-8"
              )
          )

          book.add_item(
              style
          )


          # ============================================================
          # ADD IMAGES
          # ============================================================

          epub_images = {}

          for info in image_files.values():

              path = info[
                  "path"
              ]

              ext = path.suffix.lower()

              if ext in {
                  ".jpg",
                  ".jpeg"
              }:
                  media_type = "image/jpeg"

              elif ext == ".gif":
                  media_type = "image/gif"

              elif ext == ".webp":
                  media_type = "image/webp"

              else:
                  media_type = "image/png"

              with open(
                  path,
                  "rb"
              ) as f:
                  data = f.read()

              item = epub.EpubItem(
                  uid=(
                      "img_"
                      +
                      path.stem
                  ),

                  file_name=(
                      "Images/"
                      +
                      path.name
                  ),

                  media_type=media_type,

                  content=data
              )

              book.add_item(
                  item
              )

              epub_images[
                  path.name
              ] = item


          # ============================================================
          # BUILD CHAPTERS
          # ============================================================

          spine = [
              "nav"
          ]

          toc = []

          for chapter_index, chapter in enumerate(
              chapters
          ):

              chapter_id = (
                  f"chapter_{chapter_index + 1}"
              )

              filename = (
                  f"{chapter_id}.xhtml"
              )

              chapter_html = [
                  '<html xmlns="http://www.w3.org/1999/xhtml">',

                  "<head>",

                  '<meta charset="utf-8"/>',

                  "<title>"
                  +
                  html.escape(
                      chapter["title"]
                  )
                  +
                  "</title>",

                  (
                      '<link rel="stylesheet" '
                      'type="text/css" '
                      'href="../Styles/style.css"/>'
                  ),

                  "</head>",

                  "<body>"
              ]

              first_text = True

              for page_number in chapter[
                  "pages"
              ]:

                  elements = page_elements[
                      page_number
                  ]

                  for element in elements:

                      # ==================================================
                      # TEXT
                      # ==================================================

                      if element[
                          "kind"
                      ] == "text":

                          text = element[
                              "text"
                          ]

                          escaped = html.escape(
                              text
                          )

                          if (
                              element["role"]
                              ==
                              "chapter"
                          ):

                              chapter_html.append(
                                  '<p class="chapter-title">'
                                  +
                                  escaped
                                  +
                                  "</p>"
                              )

                          else:

                              if first_text:
                                  class_name = (
                                      "no-indent"
                                  )
                              else:
                                  class_name = ""

                              if class_name:
                                  chapter_html.append(
                                      '<p class="'
                                      +
                                      class_name
                                      +
                                      '">'
                                      +
                                      escaped
                                      +
                                      "</p>"
                                  )
                              else:
                                  chapter_html.append(
                                      "<p>"
                                      +
                                      escaped
                                      +
                                      "</p>"
                                  )

                          first_text = False


                      # ==================================================
                      # IMAGE
                      # ==================================================

                      elif element[
                          "kind"
                      ] == "image":

                          image_filename = element[
                              "filename"
                          ]

                          if (
                              image_filename
                              not in epub_images
                          ):
                              continue

                          x1, y1, x2, y2 = (
                              element["bbox"]
                          )

                          page_width = pages[
                              page_number
                          ]["width"]

                          width_ratio = (
                              (x2 - x1)
                              /
                              page_width
                          )

                          center_x = (
                              (x1 + x2)
                              /
                              2
                          )

                          if width_ratio >= 0.85:
                              size = "image-full"

                          elif width_ratio >= 0.55:
                              size = "image-large"

                          elif width_ratio >= 0.30:
                              size = "image-medium"

                          else:
                              size = "image-small"

                          if (
                              center_x
                              <
                              page_width * 0.35
                          ):
                              alignment = "image-left"

                          elif (
                              center_x
                              >
                              page_width * 0.65
                          ):
                              alignment = "image-right"

                          else:
                              alignment = "image-center"

                          classes = (
                              "pdf-image "
                              +
                              size
                              +
                              " "
                              +
                              alignment
                          )

                          chapter_html.append(
                              '<img class="'
                              +
                              html.escape(
                                  classes,
                                  quote=True
                              )
                              +
                              '" src="../Images/'
                              +
                              html.escape(
                                  image_filename,
                                  quote=True
                              )
                              +
                              '" alt=""/>'
                          )


              chapter_html.append(
                  "</body></html>"
              )

              chapter_item = epub.EpubHtml(
                  title=chapter[
                      "title"
                  ],

                  file_name=filename,

                  lang=LANGUAGE
              )

              chapter_item.content = (
                  "".join(
                      chapter_html
                  ).encode(
                      "utf-8"
                  )
              )

              chapter_item.add_item(
                  style
              )

              book.add_item(
                  chapter_item
              )

              spine.append(
                  chapter_item
              )

              toc.append(
                  epub.Link(
                      filename,

                      chapter[
                          "title"
                      ],

                      chapter_id
                  )
              )


          # ============================================================
          # NAVIGATION
          # ============================================================

          book.toc = tuple(
              toc
          )

          book.add_item(
              epub.EpubNcx()
          )

          book.add_item(
              epub.EpubNav()
          )

          book.spine = spine


          # ============================================================
          # METADATA
          # ============================================================

          book.add_metadata(
              "DC",
              "description",

              (
                  "Converted locally from PDF to EPUB. "
                  "No external AI service is used. "
                  "Text is extracted from the original PDF "
                  "text layer and document layout is detected "
                  "using local heuristics."
              )
          )


          # ============================================================
          # WRITE EPUB
          # ============================================================

          output = (
              OUT
              /
              (
                  safe_filename(
                      TITLE
                  )
                  +
                  ".epub"
              )
          )

          epub.write_epub(
              str(output),
              book
          )

          print("")
          print("=" * 70)
          print("DONE")
          print("=" * 70)

          print(
              "Output:",
              output
          )

          print(
              "Pages:",
              PAGE_COUNT
          )

          print(
              "Chapters:",
              len(chapters)
          )

          print(
              "Images:",
              len(epub_images)
          )

          print(
              "Median font:",
              round(
                  median_font_size,
                  2
              )
          )

          print("=" * 70)

          PY

          python -m py_compile convert.py
          python convert.py

      # ============================================================
      # VALIDATE
      # ============================================================

      - name: Validate EPUB
        run: |
          set -e

          EPUB=$(find output \
            -maxdepth 1 \
            -type f \
            -name "*.epub" \
            | head -n 1)

          if [ -z "$EPUB" ]; then
            echo "EPUB tidak ditemukan."
            exit 1
          fi

          echo "EPUB:"
          ls -lh "$EPUB"

          echo "Testing EPUB ZIP structure..."

          unzip -t "$EPUB"

      # ============================================================
      # UPLOAD EPUB
      # ============================================================

      - name: Upload EPUB
        uses: actions/upload-artifact@v4
        with:
          name: epub-${{ github.run_number }}
          path: output/*.epub
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # DEBUG DATA
      # ============================================================

      - name: Upload layout debug data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-debug-${{ github.run_number }}
          path: work/
          if-no-files-found: warn
          retention-days: 7

