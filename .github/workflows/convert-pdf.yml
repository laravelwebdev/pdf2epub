name: Convert PDF to Markdown - CPU

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "URL Link of the PDF file to convert (optional)"
        required: false
        type: string

      title:
        description: "Book Title (Judul Buku)"
        required: false
        default: "Document"
        type: string

      author:
        description: "Author (Pengarang)"
        required: false
        default: "Unknown"
        type: string

      chapter_pages:
        description: "Halaman PDF awal chapter (dipisahkan koma, misal: 4,15,18)"
        required: false
        default: ""
        type: string

      output_format:
        description: "Output format"
        required: false
        default: "markdown"
        type: choice
        options:
          - markdown
          - html

jobs:
  convert-pdf:
    name: Convert PDF on CPU
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # System dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            file \
            git \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libgdk-pixbuf-2.0-0 \
            libcairo2 \
            libffi-dev \
            shared-mime-info

      # ---------------------------------------------------------
      # Python
      # ---------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # Install uv
      # ---------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # ---------------------------------------------------------
      # Install Marker & Dependencies
      # ---------------------------------------------------------
      - name: Install Marker PDF and mark2epub requirements
        run: |
          uv pip install --system "marker-pdf[full]" markdown pypdf pymupdf

      # ---------------------------------------------------------
      # Create directories
      # ---------------------------------------------------------
      - name: Prepare directories
        run: |
          mkdir -p input
          mkdir -p output

      # ---------------------------------------------------------
      # Prepare PDF (Download or use input.pdf)
      # ---------------------------------------------------------
      - name: Prepare PDF input
        env:
          PDF_URL: ${{ inputs.pdf_url }}
        run: |
          if [ -n "${PDF_URL}" ]; then
            echo "Downloading PDF from URL: ${PDF_URL}..."
            curl \
              --fail \
              --location \
              --show-error \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 600 \
              "${PDF_URL}" \
              --output input/document.pdf
          else
            echo "No PDF URL provided. Looking for input.pdf in repository..."
            if [ -f "input.pdf" ]; then
              echo "Using input.pdf from repository."
              cp input.pdf input/document.pdf
            else
              echo "ERROR: No PDF URL provided and input.pdf not found in repository."
              exit 1
            fi
          fi

          if [ ! -f input/document.pdf ]; then
            echo "ERROR: PDF file was not created."
            exit 1
          fi

          if [ ! -s input/document.pdf ]; then
            echo "ERROR: Input PDF is empty."
            exit 1
          fi

          echo "Input PDF:"
          ls -lh input/document.pdf

          echo "File information:"
          file input/document.pdf

      # ---------------------------------------------------------
      # Check PDF
      # ---------------------------------------------------------
      - name: Validate PDF
        run: |
          if ! file input/document.pdf | grep -qi "PDF"; then
            echo "ERROR: Input file does not appear to be a PDF."
            exit 1
          fi

          echo "PDF validation successful."

      # ---------------------------------------------------------
      # Convert PDF
      # ---------------------------------------------------------
      - name: Convert PDF to Markdown
        env:
          TORCH_DEVICE: cpu
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_DISABLE_TELEMETRY: "1"
          CHAPTER_PAGES: ${{ inputs.chapter_pages }}
        run: |
          echo "======================================"
          echo "CPU-only PDF conversion"
          echo "======================================"

          python - << 'EOF'
          import os
          import re
          import glob
          import shutil
          import subprocess
          import sys

          chapter_pages_str = os.getenv("CHAPTER_PAGES", "").strip()

          def parse_chapter_pages(pages_str):
              if not pages_str:
                  return []
              parts = re.split(r'[,\s]+', str(pages_str).strip())
              pages = []
              for p in parts:
                  if p.isdigit():
                      val = int(p)
                      if val > 0:
                          pages.append(val)
              return sorted(list(set(pages)))

          target_pages = parse_chapter_pages(chapter_pages_str)
          pdf_path = "input/document.pdf"

          if target_pages:
              print(f"Chapter pages specified: {target_pages}")
              total_pages = 0
              doc = None
              reader = None

              try:
                  import fitz
                  doc = fitz.open(pdf_path)
                  total_pages = len(doc)
              except Exception as e:
                  print(f"PyMuPDF not available or failed ({e}), falling back to pypdf...")
                  from pypdf import PdfReader, PdfWriter
                  reader = PdfReader(pdf_path)
                  total_pages = len(reader.pages)

              print(f"Total PDF pages: {total_pages}")

              if target_pages[0] > 1:
                  chapter_starts = [1] + target_pages
              else:
                  chapter_starts = target_pages

              ranges = []
              for idx in range(len(chapter_starts)):
                  start_p = chapter_starts[idx]
                  if idx + 1 < len(chapter_starts):
                      end_p = chapter_starts[idx + 1] - 1
                  else:
                      end_p = total_pages
                  if start_p <= total_pages:
                      ranges.append((idx, start_p, min(end_p, total_pages)))

              os.makedirs("input/chapters", exist_ok=True)
              os.makedirs("output", exist_ok=True)
              os.makedirs("output/images", exist_ok=True)

              for idx, start_p, end_p in ranges:
                  ch_pdf = f"input/chapters/chapter_{idx:02d}.pdf"
                  print(f"Creating {ch_pdf} for PDF pages {start_p} to {end_p}...")
                  if doc is not None:
                      new_doc = fitz.open()
                      new_doc.insert_pdf(doc, from_page=start_p - 1, to_page=end_p - 1)
                      new_doc.save(ch_pdf)
                      new_doc.close()
                  else:
                      from pypdf import PdfWriter
                      writer = PdfWriter()
                      for p in range(start_p - 1, end_p):
                          writer.add_page(reader.pages[p])
                      with open(ch_pdf, "wb") as f_out:
                          writer.write(f_out)

                  ch_output_dir = f"output/ch_{idx:02d}"
                  cmd = [
                      "marker_single",
                      ch_pdf,
                      "--output_dir", ch_output_dir,
                      "--output_format", "markdown",
                      "--disable_ocr"
                  ]
                  print(f"Running: {' '.join(cmd)}")
                  res = subprocess.run(cmd)
                  if res.returncode != 0:
                      print(f"ERROR: marker_single failed on {ch_pdf} with code {res.returncode}")
                      sys.exit(res.returncode)

                  sub_dirs = [d for d in glob.glob(f"{ch_output_dir}/*") if os.path.isdir(d)]
                  sub_dir = sub_dirs[0] if sub_dirs else ch_output_dir

                  md_files = glob.glob(os.path.join(sub_dir, "*.md"))
                  if md_files:
                      dest_md = f"output/chapter_{idx:02d}.md"
                      shutil.copy(md_files[0], dest_md)
                      print(f"Saved {dest_md}")

                  for root, dirs, files in os.walk(sub_dir):
                      for f in files:
                          if f.lower().endswith((".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg")):
                              shutil.copy(os.path.join(root, f), os.path.join("output/images", f))

              if doc is not None:
                  doc.close()

          else:
              print("No chapter pages specified. Converting entire PDF at once...")
              cmd = [
                  "marker_single",
                  pdf_path,
                  "--output_dir", "output",
                  "--output_format", "markdown",
                  "--disable_ocr"
              ]
              print(f"Running: {' '.join(cmd)}")
              res = subprocess.run(cmd)
              if res.returncode != 0:
                  print(f"ERROR: marker_single failed with code {res.returncode}")
                  sys.exit(res.returncode)

          # Flatten subdirectories created inside output (e.g., ch_XX or document) into output/ root
          sub_dirs = [d for d in glob.glob("output/*") if os.path.isdir(d) and os.path.basename(d) != "images"]
          for sdir in sub_dirs:
              for root, dirs, files in os.walk(sdir):
                  for f in files:
                      src = os.path.join(root, f)
                      if f.endswith(".md") and not os.path.exists(os.path.join("output", f)):
                          shutil.copy(src, os.path.join("output", f))
                      elif f.lower().endswith((".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg")):
                          shutil.copy(src, os.path.join("output/images", f))
              shutil.rmtree(sdir)

          # Render PDF Page 1 as cover image (cover.png)
          try:
              import fitz
              pdf_cover_doc = fitz.open(pdf_path)
              if len(pdf_cover_doc) > 0:
                  os.makedirs("output/images", exist_ok=True)
                  cover_file = "output/images/cover.png"
                  pix = pdf_cover_doc[0].get_pixmap(dpi=150)
                  pix.save(cover_file)
                  print("Rendered PDF page 1 cover image to", cover_file)
              pdf_cover_doc.close()
          except Exception as e_cov:
              print(f"Warning: Could not render page 1 cover image: {e_cov}")

          print("======================================")
          print("Conversion completed")
          print("======================================")
          EOF

      # ---------------------------------------------------------
      # Convert Markdown to EPUB using local mark2epub.py
      # ---------------------------------------------------------
      - name: Convert Markdown to EPUB
        env:
          BOOK_TITLE: ${{ inputs.title }}
          BOOK_AUTHOR: ${{ inputs.author }}
          CHAPTER_PAGES: ${{ inputs.chapter_pages }}
        run: |
          echo "Converting Markdown to EPUB using local mark2epub.py..."
          python - << 'EOF'
          import os
          import json
          import glob
          import shutil
          import subprocess
          import sys
          import re

          title = os.getenv("BOOK_TITLE", "").strip() or "Document"
          author = os.getenv("BOOK_AUTHOR", "").strip() or "Unknown"
          chapter_pages = os.getenv("CHAPTER_PAGES", "").strip()

          target_dir = "output"

          images_dir = os.path.join(target_dir, "images")
          css_dir = os.path.join(target_dir, "css")
          os.makedirs(images_dir, exist_ok=True)
          os.makedirs(css_dir, exist_ok=True)

          # Copy CSS files from repo's css/ directory into target_dir/css/
          repo_css_dir = "css"
          if os.path.exists(repo_css_dir):
              for f in os.listdir(repo_css_dir):
                  if f.endswith(".css"):
                      shutil.copy(os.path.join(repo_css_dir, f), os.path.join(css_dir, f))

          css_files = sorted([f for f in os.listdir(css_dir) if f.endswith(".css")])

          # Collect images produced by marker-pdf into target_dir/images/
          for root, dirs, files in os.walk(target_dir):
              if os.path.abspath(root) == os.path.abspath(images_dir):
                  continue
              for f in files:
                  if f.lower().endswith((".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg")):
                      src_path = os.path.join(root, f)
                      dest_path = os.path.join(images_dir, f)
                      if not os.path.exists(dest_path):
                          shutil.move(src_path, dest_path)

          # Update markdown image links to use images/ folder and normalize chapter title headings to H1 (# Title)
          def fix_image_link(match):
              alt = match.group(1)
              img_name = os.path.basename(match.group(2))
              return f"![{alt}](images/{img_name})"

          for md_path in glob.glob(os.path.join(target_dir, "*.md")):
              with open(md_path, "r", encoding="utf-8") as f_md:
                  content = f_md.read()
              
              new_content = re.sub(
                  r'!\[(.*?)\]\((?:\.?\/)?(?:images\/)?([^\s\)\"]+\.(?:png|jpg|jpeg|gif|webp|svg))\)',
                  fix_image_link,
                  content,
                  flags=re.IGNORECASE
              )
              
              # Normalize first heading in chapter file to H1 (# Title)
              lines = new_content.splitlines()
              first_h_idx = -1
              first_h_match = None
              for idx_l, line in enumerate(lines):
                  m = re.match(r'^(#{1,6})\s+(.+)$', line.strip())
                  if m:
                      first_h_idx = idx_l
                      first_h_match = m
                      break

              if first_h_idx != -1:
                  raw_t = first_h_match.group(2).strip()
                  lines[first_h_idx] = f"# {raw_t}"
              else:
                  base_name = os.path.basename(md_path).rsplit(".", 1)[0]
                  lines.insert(0, f"# {base_name.replace('_', ' ').title()}\n")

              norm_content = "\n".join(lines) + "\n"
              with open(md_path, "w", encoding="utf-8") as f_md:
                  f_md.write(norm_content)

          if os.path.exists(os.path.join(images_dir, "cover.png")):
              cover_image = "cover.png"
          else:
              image_files = sorted([f for f in os.listdir(images_dir) if f.lower().endswith((".png", ".jpg", ".jpeg", ".gif"))])
              cover_image = image_files[0] if image_files else ""

          # Initial description.json metadata
          desc = {
              "metadata": {
                  "dc:title": title,
                  "dc:creator": author,
                  "dc:language": "en-US",
                  "dc:identifier": "document-1",
                  "dc:date": "2026-08-09"
              },
              "cover_image": cover_image,
              "default_css": css_files
          }

          if chapter_pages:
              desc["chapter_pages"] = chapter_pages

          desc_path = os.path.join(target_dir, "description.json")
          with open(desc_path, "w", encoding="utf-8") as f:
              json.dump(desc, f, indent=4)

          print(f"Generated initial description.json:\n{json.dumps(desc, indent=2)}")

          epub_output = os.path.join("output", "book.epub")
          cmd = ["python", "mark2epub.py", target_dir, epub_output]
          print(f"Running command: {' '.join(cmd)}")
          res = subprocess.run(cmd)
          if res.returncode != 0:
              print(f"ERROR: mark2epub conversion failed with code {res.returncode}")
              sys.exit(res.returncode)

          print("EPUB creation successful:", epub_output)
          EOF

      # ---------------------------------------------------------
      # Show generated files
      # ---------------------------------------------------------
      - name: Inspect output
        run: |
          echo "Generated files:"
          find output -type f -printf '%p\n'

          echo
          echo "Output sizes:"
          du -ah output | sort -h

      # ---------------------------------------------------------
      # Check that output exists
      # ---------------------------------------------------------
      - name: Verify output
        run: |
          if [ -z "$(find output -type f -print -quit)" ]; then
            echo "ERROR: No output files were generated."
            exit 1
          fi

          echo "Output verification successful."

      # ---------------------------------------------------------
      # Upload result
      # ---------------------------------------------------------
      - name: Upload converted output
        uses: actions/upload-artifact@v4
        with:
          name: converted-pdf-output
          path: output/
          if-no-files-found: error
          retention-days: 7